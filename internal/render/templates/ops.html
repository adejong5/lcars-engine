{{define "content"}}
  <div class="lcars-text-bar"><h3>Operations</h3></div>

  <!-- Live region: SSE pushes per-entity fragments (sse-swap by entity id);
       hx-get is an infrequent fallback poll that reconciles missed events. -->
  <div class="pillbox" hx-ext="sse" sse-connect="sse">
    {{range .Cells}}
      <div class="pill" id="{{.ID}}"
           sse-swap="{{.ID}}"
           hx-get="cells/{{.ID}}" hx-trigger="every 60s">{{template "cell" .Tile}}</div>
    {{end}}
  </div>
{{end}}

{{/* one live cell's inner fragment; kept on a single line for SSE data: */}}
{{define "cell"}}{{.Label}}<span class="hop">{{.Value}}</span>{{end}}
