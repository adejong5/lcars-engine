name: Publish add-on images

# On a version tag, build and push the per-arch images the add-on manifest
# references (ghcr.io/adejong5/{arch}-lcars-engine). The Dockerfile cross-
# compiles with Go (build stage runs on the native runner), so no emulation
# is needed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version from tag
        id: ver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/adejong5/${{ matrix.arch }}-lcars-engine:${{ steps.ver.outputs.v }}
            ghcr.io/adejong5/${{ matrix.arch }}-lcars-engine:latest
